name: iOS — build, upload & publish listing
on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Only submit 1.0 for App Review (needs a processed build)"
        type: boolean
        default: false
      listing_only:
        description: "Only publish the store listing (skip the build)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["www/**", "ios/**", "fastlane/Fastfile", "package.json", "capacitor.config.json", ".github/workflows/ios-release.yml"]
concurrency: ios-release
env:
  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
  ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8
jobs:
  build:
    if: ${{ !inputs.submit && !inputs.listing_only }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (App Store requires the iOS 26 SDK)
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "::error::No Xcode 26 on this runner image"; ls /Applications | grep Xcode; exit 1; fi
          sudo xcode-select -s "$XC"; xcodebuild -version
      - name: Check secrets
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::Add repository secrets ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 (Settings → Secrets and variables → Actions)."; exit 1; fi
      - name: Restore signing certificate (encrypted)
        id: signing
        uses: actions/cache/restore@v4
        with:
          path: signing
          key: dist-cert-v1
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx cap sync ios
      - name: CocoaPods
        working-directory: ios/App
        run: pod install --repo-update
      - name: Build, sign & upload
        run: fastlane ios release
      - name: Save signing certificate (encrypted)
        if: always() && steps.signing.outputs.cache-hit != 'true' && hashFiles('signing/dist.p12.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: signing
          key: dist-cert-v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipa-and-logs
          path: |
            build/*.ipa
            ~/Library/Logs/gym/*.log
          if-no-files-found: ignore
  listing:
    if: ${{ !cancelled() && !inputs.submit && (inputs.listing_only || needs.build.result == 'success') }}
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Publish store listing
        run: fastlane ios listing
  submit:
    if: ${{ inputs.submit }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Submit 1.0 for review
        run: fastlane ios submit
